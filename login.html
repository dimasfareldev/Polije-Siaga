<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Polije Siaga</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body>
    <main class="login-card">
        <section class="login-section">
            <div class="login-header">
                <h1>Selamat Datang!</h1>
                <p>Silahkan login untuk melanjutkan</p>
                <div class="header-divider"></div>
            </div>

            <form class="login-form" action="login.php" method="POST">
                <div class="input-group">
                    <iconify-icon icon="lucide:user" width="20" height="20"></iconify-icon>
                    <input type="text" name="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="input-group">
                    <iconify-icon icon="lucide:key-round" width="20" height="20"></iconify-icon>
                    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-masuk">
                    <span>Masuk</span>
                    <iconify-icon icon="lucide:arrow-right" width="18" height="18"></iconify-icon>
                </button>
            </form>
        </section>
        <section class="image-section">
            <div class="image-overlay"></div>
            <div class="brand-badge">
                <img src="img/logoPolijeSiaga.png" alt="Logo Polije Siaga" class="brand-logo">
                <div class="brand-text">
                    <h2>POLIJE SIAGA</h2>
                    <p>Sistem Informasi Keamanan dan Penjagaan Polije</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
